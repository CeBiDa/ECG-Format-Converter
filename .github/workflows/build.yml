name: Build Executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact_name: ECG-Format-Converter-linux-x86_64.zip
          - os: windows-latest
            platform: windows
            arch: x86_64
            artifact_name: ECG-Format-Converter-windows-x86_64.zip
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
            artifact_name: ECG-Format-Converter-macos-arm64.app.zip

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libgl1 libegl1 libxcb-xinerama0
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install dependencies (Windows/macOS)
        if: matrix.platform != 'linux'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller ECG-Format-Converter.spec

      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          cd dist
          chmod +x ECG-Format-Converter/ECG-Format-Converter
          zip -r ../${{ matrix.artifact_name }} ECG-Format-Converter/

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path "dist\ECG-Format-Converter" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Package macOS
        if: startsWith(matrix.platform, 'macos')
        run: |
          cd dist
          zip -r ../${{ matrix.artifact_name }} ECG-Format-Converter.app/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
